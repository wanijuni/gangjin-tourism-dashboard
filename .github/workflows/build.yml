name: 대시보드 빌드·배포

# data/raw 에 CSV를 올리거나 대시보드 파일이 바뀌면 자동으로 실행됩니다.
# Actions 탭에서 "Run workflow" 버튼으로 직접 실행할 수도 있습니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CSV 합치기
        run: python scripts/build_data.py
      - name: 날씨 자료 받기 (Open-Meteo)
        run: python scripts/fetch_weather.py
      - name: 화면 파일에 버전 붙이기 (브라우저가 예전 파일을 쓰지 않도록)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(app\.js|style\.css|holidays\.js|festivals\.js|summaries\.js)\"#\1=\"\2?v=${V}\"#g" docs/index.html
          sed -i -E "s#fetch\('gangjin_emd\.geojson'\)#fetch('gangjin_emd.geojson?v=${V}')#" docs/app.js
          grep -n "?v=" docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
